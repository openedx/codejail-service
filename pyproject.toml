[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "codejail-service"
version = "0.0.0"
description = "Run codejail (sandboxed Python execution) as a service."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE*"]
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "Python",
    "edx",
]

readme = "README.rst"

dependencies = [
    "Django",
    "gunicorn",
    "edx-django-utils",
    "edx-toggles",
    "edx-codejail>=4.0.0",
    "djangorestframework",
    "jsonschema",
]

[project.urls]
Homepage = "https://github.com/openedx/codejail-service"
Repository = "https://github.com/openedx/codejail-service"

[dependency-groups]
test = [
    "code-annotations",
    "coverage",
    "edx-lint",
    "pytest-cov",
    "pytest-django",
    "tox",
    "ddt",
    "Django>=4.2,<5.0",
]
validation = [
    {include-group = "test"},
    "isort",
    "pycodestyle",
    "pydocstyle",
]
quality = [
    {include-group = "validation"},
    "twine",
]
doc = [
    {include-group = "test"},
    "doc8",
    "sphinx-book-theme",
    "Sphinx",
]
ci = [
    "tox",
    "tox-uv",
]
dev = [
    {include-group = "quality"},
    {include-group = "ci"},
    "diff-cover",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"*" = []

[tool.coverage.run]
branch = true
source = ["codejail_service"]
omit = [
    "codejail_service/settings/*",
    "codejail_service/conf/*",
    "*wsgi.py",
    "*/migrations/*",
    "*admin.py",
    "*/static/*",
    "*/templates/*",
]

[tool.coverage.report]
show_missing = true

[tool.isort]
indent = "    "
line_length = 120
multi_line_output = 3
skip = ["migrations"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "codejail_service.settings.test"
addopts = "--cov codejail_service --cov-report term-missing --cov-report xml"
norecursedirs = ["api_tests", ".*", "docs", "requirements", "site-packages"]
filterwarnings = [
    "ignore:.*urlresolvers is deprecated in favor of.*:DeprecationWarning:auth_backends.views:5",
    "ignore:.*invalid escape sequence.*:DeprecationWarning:.*(newrelic|uritemplate|psutil).*",
    "ignore:.*the imp module is deprecated in favour of importlib.*:DeprecationWarning:.*distutils.*",
]

[tool.uv]
package = true
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "social-auth-app-django<6.0.0",
    "social-auth-core<5.0.0",
    "pip<26.2.1",
]

[tool.edx_lint]
uv_constraints = []
